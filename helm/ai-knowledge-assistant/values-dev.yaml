# Dev overrides: always pull the latest image, NodePort access, debug env.
backend:
  image:
    pullPolicy: Always

frontend:
  image:
    pullPolicy: Always
  serviceType: NodePort
  nodePort: 30851

config:
  environment: development

# Public domain (HTTPS via cert-manager + Let's Encrypt). NodePort stays too.
ingress:
  enabled: true
  host: rag.usman7888.com
