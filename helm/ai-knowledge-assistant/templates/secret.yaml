apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
type: Opaque
# Values come from `helm --set secrets.*` at deploy time (from CI secrets),
# never from committed files. stringData lets us pass plain text; K8s encodes it.
stringData:
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  API_SECRET_KEY: {{ .Values.secrets.apiSecretKey | quote }}
